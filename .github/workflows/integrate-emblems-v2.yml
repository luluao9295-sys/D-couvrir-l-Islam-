name: Integrate emblems v2
on:
  push:
    paths:
      - '.github/workflows/integrate-emblems-v2.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link premium generated stylesheet
        run: python3 -c "from pathlib import Path; p=Path('visuals.css'); s=p.read_text(encoding='utf-8'); p.write_text(('@import url(\"premium-generated.css?v=1\");\\n'+s) if 'premium-generated.css' not in s else s, encoding='utf-8')"
      - name: Bust visual cache
        run: |
          python3 -c "from pathlib import Path; [(lambda p: p.write_text(p.read_text(encoding='utf-8').replace('visuals.css?v=5','visuals.css?v=8').replace('visuals.css?v=6','visuals.css?v=8').replace('visuals.css?v=7','visuals.css?v=8'),encoding='utf-8'))(p) for p in Path('.').glob('*.html')]"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuals.css *.html
          git diff --cached --quiet || git commit -m "Activate generated premium emblems"
          git push
