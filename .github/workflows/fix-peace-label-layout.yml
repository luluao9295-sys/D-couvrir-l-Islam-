name: Fix peace label layout
on:
  push:
    paths:
      - '.github/workflows/fix-peace-label-layout.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix prophet card labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('prophetes.html')
          css_path = Path('prophetes-premium.css')

          html = html_path.read_text(encoding='utf-8')
          # Remove any previous explicit labels to avoid duplicates.
          html = re.sub(r'<span class="peace-fr">— paix sur lui</span>', '', html)
          # Insert exactly one explicit label after each honorific, before </h3>.
          html = re.sub(
              r'(<span class="honorific"[^>]*>.*?</span>)(</h3>)',
              r'\1<span class="peace-fr">— paix sur lui</span>\2',
              html,
              flags=re.S
          )
          html = html.replace('prophetes-premium.css?v=6', 'prophetes-premium.css?v=7')
          html_path.write_text(html, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          # Remove the previous generated pseudo-element solution entirely.
          css = re.sub(
              r'/\* Tous les prophètes : même disposition qu\'Adam\.[\s\S]*?(?=body\[data-page="prophetes"\] \.meta)',
              '',
              css
          )
          css += '''\n/* Libellé explicite : même disposition qu'Adam, sans pseudo-élément */\nbody[data-page="prophetes"] #prophetGrid .card h3 .honorific{\n  display:inline!important;\n  white-space:nowrap!important;\n}\nbody[data-page="prophetes"] #prophetGrid .card h3 .peace-fr{\n  display:block!important;\n  width:100%!important;\n  margin-top:7px!important;\n  color:#b99352!important;\n  font:600 .58em/1.2 Georgia,serif!important;\n  letter-spacing:0!important;\n  white-space:nowrap!important;\n}\nbody[data-page="prophetes"] #prophetGrid .card h3::after,\nbody[data-page="prophetes"] #prophetGrid .card h3 .honorific::before,\nbody[data-page="prophetes"] #prophetGrid .card h3 .honorific::after{\n  content:none!important;\n  display:none!important;\n}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY
          rm .github/workflows/fix-peace-label-layout.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prophetes.html prophetes-premium.css .github/workflows/fix-peace-label-layout.yml
          git commit -m "Aligner paix sur lui comme Adam pour les 25 prophètes"
          git push
