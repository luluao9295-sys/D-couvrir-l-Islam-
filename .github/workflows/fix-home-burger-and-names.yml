name: Fix homepage burger and 99 names
on:
  push:
    paths:
      - '.github/workflows/fix-home-burger-and-names.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage and create names page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          # Capture the full 99 names section before removing it from home.
          m = re.search(r'<section class="section alt" id="noms">.*?</section>', html, flags=re.S)
          if not m:
              raise SystemExit('99 names section not found')
          names_section = m.group(0)

          # Build a dedicated 99 names page from the current visual system.
          head = re.search(r'(<head>.*?</head>)', html, flags=re.S).group(1)
          header = re.search(r'(<header class="site-header">.*?</header>)', html, flags=re.S).group(1)
          footer = re.search(r'(<footer>.*?</footer>)', html, flags=re.S).group(1)
          head = head.replace('<title>Découvrir l’Islam — Apprendre simplement</title>', '<title>Les 99 noms — Découvrir l’Islam</title>')
          head = head.replace('<link rel="stylesheet" href="polish.css?v=3">', '<link rel="stylesheet" href="polish.css?v=5">')
          header = header.replace('href="#noms">99 noms</a>', 'href="noms.html">99 noms</a>')
          names_page = f'''<!doctype html>\n<html lang="fr">\n{head}\n<body data-page="noms">\n{header}\n<main>{names_section}</main>\n{footer}\n<script>\nconst btn=document.getElementById('menuBtn'),nav=document.getElementById('mainNav');\nif(btn&&nav){{\n const close=()=>{{nav.classList.remove('open');btn.setAttribute('aria-expanded','false');document.body.classList.remove('menu-open')}};\n btn.addEventListener('click',e=>{{e.stopPropagation();const open=!nav.classList.contains('open');nav.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));document.body.classList.toggle('menu-open',open)}});\n nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));\n document.addEventListener('click',e=>{{if(!nav.contains(e.target)&&!btn.contains(e.target))close()}});\n document.addEventListener('keydown',e=>{{if(e.key==='Escape')close()}});\n}}\nconst search=document.getElementById('nameSearch'),cards=[...document.querySelectorAll('.name-card')],counter=document.getElementById('counter');\nif(search&&counter)search.addEventListener('input',()=>{{const q=search.value.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');let n=0;cards.forEach(c=>{{const t=c.innerText.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');const ok=t.includes(q);c.style.display=ok?'':'none';if(ok)n++}});counter.textContent=n+' nom'+(n>1?'s':'')}});\n</script>\n</body>\n</html>'''
          Path('noms.html').write_text(names_page, encoding='utf-8')

          # Simplify homepage: remove names list entirely and route links to dedicated page.
          html = html[:m.start()] + html[m.end():]
          html = html.replace('href="#noms">99 noms</a>', 'href="noms.html">99 noms</a>')
          html = html.replace('href="#noms"><div class="topic-icon"></div>', 'href="noms.html"><div class="topic-icon"></div>')
          html = html.replace('<link rel="stylesheet" href="polish.css?v=3">', '<link rel="stylesheet" href="polish.css?v=5">')

          # Replace fragile burger/search JS with robust burger only on homepage.
          html = re.sub(r'<script>\s*const btn=.*?</script>', '''<script>\nconst btn=document.getElementById('menuBtn'),nav=document.getElementById('mainNav');\nif(btn&&nav){\n const close=()=>{nav.classList.remove('open');btn.setAttribute('aria-expanded','false');document.body.classList.remove('menu-open')};\n btn.addEventListener('click',e=>{e.stopPropagation();const open=!nav.classList.contains('open');nav.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));document.body.classList.toggle('menu-open',open)});\n nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));\n document.addEventListener('click',e=>{if(!nav.contains(e.target)&&!btn.contains(e.target))close()});\n document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});\n}\n</script>''', html, count=1, flags=re.S)

          p.write_text(html, encoding='utf-8')
          PY
      - name: Strengthen mobile burger CSS
        run: |
          cat >> polish.css <<'CSS'

          /* v5 — robust burger + dedicated 99 names page */
          @media(max-width:980px){
            body.menu-open{overflow:hidden!important}
            .site-header{overflow:visible!important}
            .site-header .nav{
              position:fixed!important;top:76px!important;left:14px!important;right:14px!important;width:auto!important;
              margin:0!important;padding:10px!important;display:none!important;flex-direction:column!important;align-items:stretch!important;
              gap:2px!important;max-height:calc(100dvh - 94px)!important;overflow-y:auto!important;overflow-x:hidden!important;
              background:#fbf7ef!important;border:1px solid rgba(18,61,52,.14)!important;border-radius:18px!important;
              box-shadow:0 24px 70px rgba(18,61,52,.28)!important;z-index:10000!important
            }
            .site-header .nav.open{display:flex!important}
            .site-header .nav a{display:block!important;width:100%!important;padding:13px 14px!important;border-radius:12px!important;font-size:16px!important;line-height:1.2!important;white-space:normal!important}
            .menu-btn{z-index:10001!important}
          }
          body[data-page="noms"] main{padding-top:26px}
          body[data-page="noms"] #noms{display:block!important}
          body[data-page="noms"] #noms::before{display:none!important;content:none!important}
          CSS
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html noms.html polish.css
          git commit -m 'Simplify homepage and fix burger menu'
          git push
