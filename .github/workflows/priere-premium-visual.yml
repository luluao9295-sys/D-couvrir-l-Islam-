name: Premium prayer page visual upgrade
on:
  push:
    paths:
      - '.github/workflows/priere-premium-visual.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade prayer page visuals
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('priere.html')
          s=p.read_text(encoding='utf-8')

          premium='''\n<style id="prayerPremiumVisuals">\nbody{background:#f7f1e7}.prayer-visual-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;align-items:center}.hero-copy{max-width:650px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.hero-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:999px;text-decoration:none;font-weight:900;border:1px solid rgba(18,61,52,.14)}.hero-btn.primary{background:var(--green);color:#fff}.hero-btn.secondary{background:rgba(255,255,255,.78);color:var(--green)}.hero-art{position:relative;min-height:360px;border-radius:30px;overflow:hidden;border:1px solid rgba(18,61,52,.12);box-shadow:0 28px 70px rgba(18,61,52,.15);background:linear-gradient(180deg,#e9d8ba 0%,#f7e8c8 45%,#d7e5dc 100%)}.hero-art img{width:100%;height:100%;min-height:360px;object-fit:cover;display:block}.hero-quote{position:absolute;left:18px;right:18px;bottom:18px;padding:14px 16px;border-radius:18px;background:rgba(255,250,241,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);font-family:Georgia,serif;color:var(--green);font-size:15px}.section-title-row{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.section-kicker{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#efe3cd;color:#7f673f;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.wudu-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wudu-card{padding:16px;min-height:210px;border-radius:24px!important;background:linear-gradient(180deg,#fff 0%,#fffaf1 100%);overflow:hidden}.wudu-card::after{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;background:rgba(28,92,79,.06)}.wudu-visual{width:100%;height:105px;border-radius:18px;font-size:46px;margin-bottom:14px;background:linear-gradient(135deg,#eef6f2,#f7ead5);box-shadow:inset 0 0 0 1px rgba(18,61,52,.05)}.count{top:12px;right:12px;font-size:14px;padding:7px 10px;box-shadow:0 8px 22px rgba(18,61,52,.18)}.five .prayer{position:relative;overflow:hidden;text-align:left;min-height:190px;padding-top:82px}.five .prayer::before{content:"";position:absolute;inset:0 0 auto 0;height:70px;background:linear-gradient(135deg,#e8c89a,#f5dfbb)}.five .prayer:nth-child(1)::before{background:linear-gradient(135deg,#6f7c9c,#f0b28b)}.five .prayer:nth-child(2)::before{background:linear-gradient(135deg,#f3d19b,#fff0bd)}.five .prayer:nth-child(3)::before{background:linear-gradient(135deg,#d6af73,#efc886)}.five .prayer:nth-child(4)::before{background:linear-gradient(135deg,#cc846c,#684f75)}.five .prayer:nth-child(5)::before{background:linear-gradient(135deg,#21384f,#4f6480)}.five .prayer .tag{position:absolute;top:18px;left:16px;background:rgba(255,255,255,.82)!important}.five .prayer strong{font-size:31px}.steps .step{position:relative;overflow:hidden;background:linear-gradient(180deg,#fff,#fbf7ef)}.steps .step::after{content:"";position:absolute;right:-28px;bottom:-32px;width:90px;height:90px;border-radius:50%;background:rgba(185,147,82,.08)}.steps .num{box-shadow:0 8px 18px rgba(18,61,52,.18)}.premium-panel{background:linear-gradient(135deg,#123d34,#1c5c4f);color:#fff;border-radius:26px;padding:24px;box-shadow:0 22px 60px rgba(18,61,52,.18);margin:26px 0}.premium-panel h3{color:#fff;margin-top:0}.premium-panel p{color:#e6f0ec}.premium-panel .source{color:#d3e1dc!important}.card{background:linear-gradient(180deg,#fff,#fffdf8)}\n@media(max-width:900px){.prayer-visual-hero{grid-template-columns:1fr}.hero-art{min-height:300px}.wudu-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.five{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:640px){.hero-art,.hero-art img{min-height:240px}.hero-quote{font-size:13px}.wudu-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wudu-card{min-height:185px;padding:12px}.wudu-visual{height:88px;font-size:40px}.wudu-card h3{font-size:18px}.wudu-card p{font-size:13px}.five{grid-template-columns:1fr 1fr;gap:10px}.five .prayer{min-height:170px;padding:76px 14px 14px}.five .prayer strong{font-size:27px}.section-title-row{align-items:flex-start;flex-direction:column}.hero-actions{display:grid;grid-template-columns:1fr 1fr}.hero-btn{padding:0 10px}}\n</style>\n'''
          if 'id="prayerPremiumVisuals"' not in s:
              s=s.replace('</head>',premium+'\n</head>')

          old='<section class="hero"><div class="container"><span class="tag">🕌 Guide débutant</span><h1>Apprendre la prière, pas à pas</h1><p>Un guide simple pour comprendre les ablutions, les horaires, les cinq prières obligatoires, les mouvements et les récitations essentielles.</p><div class="progress"><div>1 · Se purifier</div><div>2 · Connaître l’heure</div><div>3 · Apprendre les mouvements</div><div>4 · Apprendre les récitations</div></div><div class="note"><strong>💡 Important :</strong> ce guide présente les bases communes. Certains détails pratiques connaissent des différences reconnues entre écoles juridiques.</div></div></section>'
          new='''<section class="hero"><div class="container prayer-visual-hero"><div class="hero-copy"><span class="tag">🕌 Guide débutant</span><h1>Apprendre la prière, pas à pas</h1><p>Un guide visuel, simple et progressif pour comprendre les ablutions, les horaires, les mouvements et les récitations essentielles.</p><div class="hero-actions"><a class="hero-btn primary" href="#ablutions">Commencer</a><a class="hero-btn secondary" href="#mouvements">Voir les étapes</a></div><div class="progress"><div>1 · Se purifier</div><div>2 · Connaître l’heure</div><div>3 · Apprendre les mouvements</div><div>4 · Apprendre les récitations</div></div></div><div class="hero-art"><img src="priere-hero.svg" alt="Illustration symbolique d'une mosquée au coucher du soleil"><div class="hero-quote">« Et accomplis la prière, car la prière préserve de ce qui est blâmable. »<br><small>Coran 29:45</small></div></div></div></section>'''
          s=s.replace(old,new)
          s=s.replace('<section class="section"><div class="container"><h2>💧 1. Les ablutions (wudû’)</h2>','<section class="section" id="ablutions"><div class="container"><div class="section-title-row"><div><span class="section-kicker">💧 Se purifier</span><h2>Les ablutions (wudû’)</h2></div><p>Chaque geste est présenté visuellement avec le nombre recommandé.</p></div>')
          s=s.replace('<section class="section"><div class="container"><h2>🧭 3. Une rak‘a, étape par étape</h2>','<section class="section" id="mouvements"><div class="container"><div class="section-title-row"><div><span class="section-kicker">🧭 Les gestes</span><h2>Une rak‘a, étape par étape</h2></div><p>Des étapes simples, dans l’ordre.</p></div>')
          p.write_text(s,encoding='utf-8')

          svg='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Mosquée au coucher du soleil"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e8c58f"/><stop offset=".55" stop-color="#f6dfb7"/><stop offset="1" stop-color="#d8e6de"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff7d8"/><stop offset="1" stop-color="#efc77e" stop-opacity=".1"/></radialGradient></defs><rect width="900" height="650" fill="url(#sky)"/><circle cx="690" cy="150" r="110" fill="url(#sun)"/><g fill="#1c5c4f" opacity=".9"><path d="M0 570h900v80H0z"/><path d="M70 570l60-150 60 150zM790 570l-55-135-55 135z"/></g><g fill="#f8f0df" stroke="#b99352" stroke-width="3"><rect x="250" y="335" width="410" height="235" rx="14"/><path d="M340 335q0-135 115-135t115 135"/><circle cx="455" cy="205" r="8" fill="#b99352"/><path d="M451 205v-60" stroke="#b99352" stroke-width="5"/><rect x="190" y="275" width="70" height="295" rx="8"/><path d="M205 275h40l-20-80z"/><circle cx="225" cy="190" r="6" fill="#b99352"/><path d="M225 190v-55" stroke="#b99352" stroke-width="4"/><rect x="650" y="290" width="66" height="280" rx="8"/><path d="M664 290h38l-19-78z"/><circle cx="683" cy="207" r="6" fill="#b99352"/><path d="M683 207v-52" stroke="#b99352" stroke-width="4"/></g><g fill="#123d34"><path d="M400 570v-120q55-55 110 0v120z"/><rect x="295" y="425" width="45" height="145" rx="22"/><rect x="570" y="425" width="45" height="145" rx="22"/></g><g fill="#d8e6de"><ellipse cx="130" cy="590" rx="110" ry="35"/><ellipse cx="770" cy="590" rx="120" ry="38"/></g></svg>'''
          Path('priere-hero.svg').write_text(svg,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add priere.html priere-hero.svg
          git commit -m "Redesign prayer page with premium visual layout"
          git push