name: Fix homepage burger and names v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage and create names page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')

          # Locate the 99 names section robustly using the id marker.
          marker='id="noms"'
          pos=html.find(marker)
          if pos==-1:
              raise SystemExit('99 names marker not found')
          start=html.rfind('<section',0,pos)
          if start==-1:
              raise SystemExit('99 names opening section not found')
          i=start
          depth=0
          end=None
          token_re=re.compile(r'<section\b|</section>')
          for m in token_re.finditer(html,start):
              if m.group(0).startswith('<section'):
                  depth+=1
              else:
                  depth-=1
                  if depth==0:
                      end=m.end()
                      break
          if end is None:
              raise SystemExit('99 names closing section not found')
          names_section=html[start:end]

          head=re.search(r'(<head>.*?</head>)',html,re.S).group(1)
          header=re.search(r'(<header class="site-header">.*?</header>)',html,re.S).group(1)
          footer=re.search(r'(<footer>.*?</footer>)',html,re.S).group(1)
          head=head.replace('<title>Découvrir l’Islam — Apprendre simplement</title>','<title>Les 99 noms — Découvrir l’Islam</title>')
          head=re.sub(r'polish\.css\?v=\d+','polish.css?v=6',head)
          header=header.replace('href="#noms">99 noms</a>','href="noms.html">99 noms</a>')

          names_page=f'''<!doctype html>\n<html lang="fr">\n{head}\n<body data-page="noms">\n{header}\n<main>{names_section}</main>\n{footer}\n<script>\nconst btn=document.getElementById('menuBtn'),nav=document.getElementById('mainNav');\nif(btn&&nav){{\n const close=()=>{{nav.classList.remove('open');btn.setAttribute('aria-expanded','false');}};\n btn.addEventListener('click',e=>{{e.stopPropagation();const open=!nav.classList.contains('open');nav.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));}});\n nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));\n document.addEventListener('click',e=>{{if(!nav.contains(e.target)&&!btn.contains(e.target))close()}});\n document.addEventListener('keydown',e=>{{if(e.key==='Escape')close()}});\n}}\nconst search=document.getElementById('nameSearch'),cards=[...document.querySelectorAll('.name-card')],counter=document.getElementById('counter');\nif(search&&counter)search.addEventListener('input',()=>{{const q=search.value.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');let n=0;cards.forEach(c=>{{const t=c.innerText.toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');const ok=t.includes(q);c.style.display=ok?'':'none';if(ok)n++}});counter.textContent=n+' nom'+(n>1?'s':'')}});\n</script>\n</body>\n</html>'''
          Path('noms.html').write_text(names_page,encoding='utf-8')

          # Remove 99 names list from homepage.
          html=html[:start]+html[end:]
          html=html.replace('href="#noms">99 noms</a>','href="noms.html">99 noms</a>')
          html=html.replace('href="#noms"><div class="topic-icon"></div>','href="noms.html"><div class="topic-icon"></div>')
          html=re.sub(r'polish\.css\?v=\d+','polish.css?v=6',html)

          # Replace homepage script with robust burger only.
          script='''<script>\nconst btn=document.getElementById('menuBtn'),nav=document.getElementById('mainNav');\nif(btn&&nav){\n const close=()=>{nav.classList.remove('open');btn.setAttribute('aria-expanded','false');};\n btn.addEventListener('click',e=>{e.stopPropagation();const open=!nav.classList.contains('open');nav.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));});\n nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',close));\n document.addEventListener('click',e=>{if(!nav.contains(e.target)&&!btn.contains(e.target))close()});\n document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});\n}\n</script>'''
          html=re.sub(r'<script>.*?</script>',script,html,count=1,flags=re.S)
          p.write_text(html,encoding='utf-8')
          PY
      - name: Strengthen burger CSS
        run: |
          cat >> polish.css <<'CSS'

          /* v6 - hard mobile burger and simple home */
          @media(max-width:980px){
            body[data-page="home"] .site-header .nav,
            body[data-page="noms"] .site-header .nav{
              display:none!important;
              position:fixed!important;
              top:72px!important;
              left:12px!important;
              right:12px!important;
              width:auto!important;
              flex-direction:column!important;
              align-items:stretch!important;
              gap:4px!important;
              padding:12px!important;
              background:#fbf7ef!important;
              border:1px solid rgba(18,61,52,.14)!important;
              border-radius:18px!important;
              box-shadow:0 24px 70px rgba(18,61,52,.24)!important;
              z-index:10000!important;
              overflow:hidden!important;
            }
            body[data-page="home"] .site-header .nav.open,
            body[data-page="noms"] .site-header .nav.open{display:flex!important}
            body[data-page="home"] .site-header .nav a,
            body[data-page="noms"] .site-header .nav a{
              display:block!important;width:100%!important;padding:12px 14px!important;
              border-radius:12px!important;white-space:normal!important;color:#123d34!important;
            }
          }
          body[data-page="home"] #noms{display:none!important}
          CSS
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html noms.html polish.css
          git commit -m "Fix homepage burger and move 99 names to dedicated page"
          git push
