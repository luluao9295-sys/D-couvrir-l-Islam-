name: Fix banner cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-banner-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force fresh banner styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('visuals.css')
          s=p.read_text()
          s=s.replace('premium-generated.css?v=1','premium-generated.css?v=4')
          p.write_text(s)

          p=Path('theme.css')
          s=p.read_text()
          s=s.replace('visuals.css?v=9','visuals.css?v=12')
          p.write_text(s)

          for name in ['index.html','prophetes.html','piliers.html','hadiths.html','invocations.html','priere.html']:
              p=Path(name)
              s=p.read_text()
              for old in ['visuals.css?v=8','visuals.css?v=9','visuals.css?v=10','visuals.css?v=11']:
                  s=s.replace(old,'visuals.css?v=12')
              s=s.replace('href="theme.css"','href="theme.css?v=12"')
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add visuals.css theme.css index.html prophetes.html piliers.html hadiths.html invocations.html priere.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Force fresh premium banners'
          git push
