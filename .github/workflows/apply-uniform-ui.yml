name: Apply uniform UI
on:
  push:
    paths:
      - '.github/workflows/apply-uniform-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject uniform stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').glob('*.html'):
              if p.name == '404.html':
                  continue
              s = p.read_text(encoding='utf-8')
              link = '<link rel="stylesheet" href="uniform-ui.css?v=1">'
              if 'uniform-ui.css' in s:
                  s = re.sub(r'<link rel="stylesheet" href="uniform-ui\.css(?:\?v=\d+)?">', link, s)
              else:
                  s = s.replace('</head>', link + '\n</head>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git diff --cached --quiet || git commit -m "Apply unified mobile menus and banners"
          git push
