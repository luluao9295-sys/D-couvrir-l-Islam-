name: Bump noms CSS cache
on:
  push:
    paths:
      - '.github/workflows/bump-noms-css-v10.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump polish css version on noms page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('noms.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('polish.css?v=6','polish.css?v=10')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noms.html
          git diff --cached --quiet || (git commit -m "Bust cache for 99 names banner" && git push)
