name: Fix prophet logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-prophet-logos.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old SVG references with new WebP logos
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('prophetes.html')
          s = p.read_text(encoding='utf-8')
          old = 'assets/prophets/${iconFiles[index]}.svg'
          new = '${iconFiles[index]}.webp'
          if old not in s:
              raise SystemExit('Old SVG reference not found')
          s = s.replace(old, new)
          s = s.replace('prophetes-premium.css?v=4', 'prophetes-premium.css?v=5')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixed page and remove one-time workflow
        run: |
          rm .github/workflows/fix-prophet-logos.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prophetes.html .github/workflows/fix-prophet-logos.yml
          git commit -m 'Fix: afficher les 25 nouveaux logos WebP'
          git push
