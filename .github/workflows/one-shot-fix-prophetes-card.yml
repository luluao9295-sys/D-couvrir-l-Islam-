name: Corriger carte Prophètes

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-prophetes-card.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corriger uniquement la carte Prophètes
        run: |
          python - <<'PY'
          from pathlib import Path

          css = Path('polish.css')
          s = css.read_text(encoding='utf-8')

          # Utiliser le visuel de rubrique d'origine sans texte incrusté.
          s = s.replace(
              "body[data-page=\"home\"] #rubriques .topic-card[href*=\"prophetes\"]{background-image:url('assets/banner-prophetes.png')!important}",
              "body[data-page=\"home\"] #rubriques .topic-card[href*=\"prophetes\"]{background-image:url('assets/rubrique-prophetes.png')!important}"
          )

          start = s.find('/* La carte Prophètes garde sa bannière d’origine ; seul le texte est aligné comme les autres cartes */')
          end = s.find('/* Keep the homepage simple: no full 99 names list */')
          if start != -1 and end != -1 and end > start:
              clean = '''/* Carte Prophètes : même composition typographique que les autres cartes */
body[data-page="home"] #rubriques .topic-card[href*="prophetes"]{
  justify-content:flex-end!important;
  align-items:stretch!important;
  text-align:left!important;
}
body[data-page="home"] #rubriques .topic-card[href*="prophetes"] .topic-label,
body[data-page="home"] #rubriques .topic-card[href*="prophetes"] h3,
body[data-page="home"] #rubriques .topic-card[href*="prophetes"] p{
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  position:relative!important;
  inset:auto!important;
  transform:none!important;
  text-align:left!important;
  align-self:auto!important;
}
body[data-page="home"] #rubriques .topic-card[href*="prophetes"] .topic-label{
  display:inline-flex!important;
  width:max-content!important;
}
body[data-page="home"] #rubriques .topic-card[href*="prophetes"] h3{
  color:#fff7df!important;
  font-family:Georgia,serif!important;
  font-size:30px!important;
  line-height:1.15!important;
  margin:0 0 8px!important;
}
body[data-page="home"] #rubriques .topic-card[href*="prophetes"] p{
  color:#f1e8d5!important;
  font-size:16px!important;
  margin:0!important;
  max-width:85%!important;
}

'''
              s = s[:start] + clean + s[end:]

          css.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          h = h.replace('polish.css?v=14', 'polish.css?v=15')
          index.write_text(h, encoding='utf-8')
          PY
      - name: Nettoyer le workflow temporaire et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-fix-prophetes-card.yml
          git add polish.css index.html
          git commit -m "Restaurer la carte Prophètes et aligner son texte comme les autres"
          git push
