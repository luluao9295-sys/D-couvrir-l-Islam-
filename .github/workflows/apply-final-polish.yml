name: Apply final premium polish
on:
  push:
    paths:
      - '.github/workflows/apply-final-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add polish stylesheet to pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=['index.html','prophetes.html','piliers.html','hadiths.html','invocations.html','priere.html']
          link='<link rel="stylesheet" href="polish.css?v=1">'
          for name in pages:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text()
              if 'polish.css' not in s:
                  s=s.replace('</head>',link+'\n</head>',1)
                  p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html prophetes.html piliers.html hadiths.html invocations.html priere.html
          git diff --cached --quiet || git commit -m 'Load final premium polish stylesheet'
          git push
