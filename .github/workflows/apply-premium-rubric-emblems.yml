name: Apply premium rubric emblems
on:
  push:
    paths:
      - '.github/workflows/apply-premium-rubric-emblems.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium emblem art to each rubric
        run: |
          cat >> visuals.css <<'CSS'

/* Premium emerald & gold emblems by rubric */
body[data-page="piliers"]{--page-art:url('assets/premium-piliers.svg')!important}
body[data-page="hadiths"]{--page-art:url('assets/premium-hadiths.svg')!important}
body[data-page="invocations"]{--page-art:url('assets/premium-invocations.svg')!important}
body[data-page="priere"]{--page-art:url('assets/premium-priere.svg')!important}
body[data-page="prophetes"]{--page-art:url('assets/premium-prophetes.svg')!important}

body[data-page="piliers"] .hero::after,
body[data-page="hadiths"] .hero::after,
body[data-page="invocations"] .hero::after,
body[data-page="priere"] .hero::after{
  opacity:.98!important;
  filter:drop-shadow(0 26px 36px rgba(18,61,52,.18))!important;
}

body[data-page="piliers"] .symbol,
body[data-page="piliers"] .icon,
body[data-page="piliers"] .pillar-icon{background-image:url('assets/premium-piliers.svg')!important}
body[data-page="hadiths"] .symbol,
body[data-page="hadiths"] .icon{background-image:url('assets/premium-hadiths.svg')!important}
body[data-page="invocations"] .symbol,
body[data-page="invocations"] .icon{background-image:url('assets/premium-invocations.svg')!important}
body[data-page="priere"] .symbol,
body[data-page="priere"] .icon{background-image:url('assets/premium-priere.svg')!important}

body[data-page="piliers"] .symbol,
body[data-page="piliers"] .icon,
body[data-page="piliers"] .pillar-icon,
body[data-page="hadiths"] .symbol,
body[data-page="hadiths"] .icon,
body[data-page="invocations"] .symbol,
body[data-page="invocations"] .icon,
body[data-page="priere"] .symbol,
body[data-page="priere"] .icon{
  background-size:cover!important;
  background-position:center!important;
  background-repeat:no-repeat!important;
  background-color:#0d3a31!important;
  border:1px solid rgba(185,147,82,.48)!important;
  box-shadow:0 14px 34px rgba(18,61,52,.17)!important;
  color:transparent!important;
  font-size:0!important;
}

body[data-page="piliers"] .symbol::before,body[data-page="piliers"] .symbol::after,
body[data-page="hadiths"] .symbol::before,body[data-page="hadiths"] .symbol::after,
body[data-page="invocations"] .symbol::before,body[data-page="invocations"] .symbol::after,
body[data-page="priere"] .symbol::before,body[data-page="priere"] .symbol::after{display:none!important}

/* 99 names emblem on homepage section */
#noms .section-head::before{
  content:"";
  display:block;
  width:78px;
  height:78px;
  flex:0 0 78px;
  border-radius:24px;
  background:#0d3a31 url('assets/premium-noms.svg') center/cover no-repeat;
  border:1px solid rgba(185,147,82,.5);
  box-shadow:0 16px 36px rgba(18,61,52,.18);
}
@media(max-width:640px){
  #noms .section-head::before{width:66px;height:66px;flex-basis:66px;border-radius:20px;margin-bottom:16px}
}
CSS

          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              s=s.replace('visuals.css?v=5','visuals.css?v=7').replace('visuals.css?v=6','visuals.css?v=7')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit rubric emblem integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visuals.css '*.html'
          git diff --cached --quiet || git commit -m "Integrate premium emblems into all rubrics"
          git push
