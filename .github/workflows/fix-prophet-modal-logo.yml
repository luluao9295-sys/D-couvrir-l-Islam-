name: Fix prophet modal logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-prophet-modal-logo.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show each WebP logo inside prophet modal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('prophetes-premium.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Modal: afficher le vrai logo WebP du prophète */'
          if marker not in s:
              s += '''\n\n/* Modal: afficher le vrai logo WebP du prophète */\nbody[data-page="prophetes"] .prophet-dialog .symbol.prophet-symbol{display:grid!important;overflow:hidden!important;padding:0!important;background:#0d3a31!important}\nbody[data-page="prophetes"] .prophet-dialog .symbol.prophet-symbol::before{display:none!important}\nbody[data-page="prophetes"] .prophet-dialog .symbol.prophet-symbol>img{display:block!important;opacity:1!important;position:relative!important;inset:auto!important;width:100%!important;height:100%!important;object-fit:cover!important;filter:none!important;z-index:3!important}\n'''
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit modal logo fix and remove one-time workflow
        run: |
          rm .github/workflows/fix-prophet-modal-logo.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prophetes-premium.css .github/workflows/fix-prophet-modal-logo.yml
          git commit -m 'Fix: afficher le logo WebP dans la fiche prophète'
          git push
